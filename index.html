<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logic Gates Pro - Διαδραστική Εκμάθηση Λογικών Πυλών</title>
    <meta name="description" content="Διαδραστική εφαρμογή εκμάθησης λογικών πυλών (AND, OR, NOT, XOR, NAND, NOR) και άλγεβρας Boole με σχεδιαστή κυκλωμάτων." />
    <meta property="og:title" content="Logic Gates Pro" />
    <meta property="og:description" content="Διαδραστική εφαρμογή εκμάθησης λογικών πυλών και σχεδιαστής κυκλωμάτων." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('logic_gates_academy_save');
          if (stored) {
            var parsed = JSON.parse(stored);
            if (parsed && parsed.state && parsed.state.theme === 'light') {
              document.documentElement.classList.remove('dark');
              return;
            }
          }
          document.documentElement.classList.add('dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
